spring.application.name=mealgen

# Database — set DB_URL, DB_USERNAME, DB_PASSWORD in environment or application-local.properties
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mealgendb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
springdoc.swagger-ui.path=/swagger-ui.html

# OpenAI — set OPENAI_API_KEY in environment or application-local.properties
openai.api.key=${OPENAI_API_KEY}
openai.model=${OPENAI_MODEL:gpt-3.5-turbo}

logging.level.io.awspring.cloud.sqs=DEBUG
logging.level.software.amazon.awssdk.services.sqs=DEBUG
spring.devtools.restart.enabled=false


