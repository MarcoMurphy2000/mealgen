openapi: 3.0.1
info:
  title: MealEntity Suggestion API
  description: API to generate meal suggestions based on available ingredients and macronutrient goals.
  version: 1.0.0
paths:
  /meals/generate:
    post:
      summary: Generate a meal suggestion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MealRequest'
      responses:
        '201':
          description: MealEntity generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meal'
        '400':
          description: Invalid macronutrient ratios or meal category provided
        '500':
          description: Failed to generate balanced meal

  /meals:
    get:
      summary: Get all meals
      responses:
        '200':
          description: List of all meals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Meal'
        '500':
          description: Failed to retrieve meals

    delete:
      summary: Delete all meals
      responses:
        '204':
          description: All meals deleted successfully
        '500':
          description: Failed to delete all meals

  /meals/{id}:
    get:
      summary: Get meal by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: MealEntity found successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meal'
        '404':
          description: MealEntity not found
        '500':
          description: Failed to retrieve meal

    put:
      summary: Update meal by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Meal'
      responses:
        '200':
          description: MealEntity updated successfully
        '400':
          description: Invalid meal data provided
        '404':
          description: MealEntity not found
        '500':
          description: Failed to update meal

    delete:
      summary: Delete meal by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: MealEntity deleted successfully
        '404':
          description: MealEntity not found
        '500':
          description: Failed to delete meal

  /recipes:
    get:
      summary: Get all recipes
      responses:
        '200':
          description: List of all recipes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Recipe'
        '500':
          description: Failed to retrieve recipes

  /recipes/{id}:
    get:
      summary: Get recipe by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: RecipeEntity found successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipe'
        '404':
          description: RecipeEntity not found
        '500':
          description: Failed to retrieve recipe

    put:
      summary: Update recipe by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Recipe'
      responses:
        '200':
          description: RecipeEntity updated successfully
        '400':
          description: Invalid recipe data provided
        '404':
          description: RecipeEntity not found
        '500':
          description: Failed to update recipe

    delete:
      summary: Delete recipe by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: RecipeEntity deleted successfully
        '404':
          description: RecipeEntity not found
        '500':
          description: Failed to delete recipe

components:
  schemas:
    MealRequest:
      type: object
      properties:
        ingredients:
          type: array
          items:
            type: string
          example: [ "Egg", "Tomato" ]
        allowExtraIngredients:
          type: boolean
          example: false
        macronutrientCustom:
          type: object
          nullable: true
          description: Optional custom macronutrient percentages
          properties:
            protein:
              type: number
              example: 30
            carbohydrates:
              type: number
              example: 40
            fat:
              type: number
              example: 30
        mealCategory:
          type: string
          enum: [ WeightLoss, MuscleGain, Maintenance, Custom ]
          nullable: true
          description: Optional predefined meal category. Either macronutrientCustom or mealCategory should be provided.

    Meal:
      type: object
      properties:
        id:
          type: integer
        ingredients:
          type: array
          items:
            type: string
          example: [ "Egg", "Tomato" ]
        protein:
          type: number
        carbohydrates:
          type: number
        fat:
          type: number
        calories:
          type: number
        category:
          type: string
          example: "Weight Loss"

    Recipe:
      type: object
      properties:
        id:
          type: integer
        recipeName:
          type: string
          example: "Scrambled Eggs"
        steps:
          type: array
          items:
            type: string
          example: [ "Crack eggs", "Cook in pan", "Serve" ]
